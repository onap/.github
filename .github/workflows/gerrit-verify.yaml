---
name: Gerrit Verify

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: 'Branch that change is against'
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: 'The ID for the change'
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: 'The Gerrit number'
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: 'URL to the change'
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: 'Type of Gerrit event'
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: 'The patch number for the change'
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: 'The revision sha'
        required: true
        type: string
      GERRIT_PROJECT:
        description: 'Project in Gerrit'
        required: true
        type: string
      GERRIT_REFSPEC:
        description: 'Gerrit refspec of change'
        required: true
        type: string

concurrency:
  # One group per Gerrit change: a new patchset supersedes the run for
  # the previous one. The change number is unique on the server, unlike
  # the Change-Id, which a cherry-pick to another branch keeps.
  # yamllint disable-line rule:line-length
  group: gerrit-verify-${{ github.event.inputs.GERRIT_PROJECT }}-${{ github.event.inputs.GERRIT_CHANGE_NUMBER || github.run_id }}
  cancel-in-progress: true

# Grant nothing by default; each job below asks for what it needs.
permissions: {}

jobs:
  clear-vote:
    name: Clear vote
    runs-on: ubuntu-latest
    # Votes travel to Gerrit over SSH, so GITHUB_TOKEN needs no scopes.
    permissions: {}
    steps:
      - name: Clear votes
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@264fe205361cbb2ee8f26280998a75680ee33b53  # v1.3.0
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
      - name: Allow replication
        run: sleep 10s

  repo-linting:
    needs: clear-vote
    # The called workflow declares no permissions of its own, so its
    # checkout relies on the grant made here.
    permissions:
      contents: read
    # Delegate actionlint + pre-commit to the shared reusable workflow so the
    # checks are maintained centrally in lfit/releng-reusable-workflows.
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/compose-repo-linting.yaml@f7aae218f1fa0257e3dcd19f5c7d3f88f482f266  # v0.10.1
    with:
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_ID: ${{ inputs.GERRIT_CHANGE_ID }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}

  vote:
    name: Set vote
    if: ${{ always() }}
    needs: [clear-vote, repo-linting]
    runs-on: ubuntu-latest
    # Votes travel to Gerrit over SSH, so GITHUB_TOKEN needs no scopes.
    permissions: {}
    steps:
      - name: Set vote
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@264fe205361cbb2ee8f26280998a75680ee33b53  # v1.3.0
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          # Read each needed job's result directly. The workflow-conclusion
          # action read the jobs API, which can still list finished jobs
          # as running; it then fell back to 'skipped', a vote type
          # gerrit-review-action rejects.
          vote-type: >-
            ${{ contains(needs.*.result, 'failure') && 'failure'
                || contains(needs.*.result, 'cancelled') && 'cancelled'
                || 'success' }}
