---
name: Gerrit Required Merge

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string
      TARGET_REPO:
        # yamllint disable-line rule:line-length
        description: "The target GitHub repository needing the required workflow"
        required: true
        type: string

concurrency:
  # One group per Gerrit change. The change number is unique on the
  # server, unlike the Change-Id: a change and its cherry-pick to a
  # maintenance branch share one, and merging both close together
  # must publish both rather than cancel one.
  # yamllint disable-line rule:line-length
  group: required-merge-${{ github.event.inputs.GERRIT_PROJECT }}-${{ github.event.inputs.GERRIT_CHANGE_NUMBER || github.run_id }}
  cancel-in-progress: true

# Grant nothing by default; each job below asks for what it needs.
permissions: {}

jobs:
  notify:
    name: Notify Gerrit
    runs-on: ubuntu-latest
    # Comments travel to Gerrit over SSH, so GITHUB_TOKEN needs no scopes.
    permissions: {}
    steps:
      - name: Notify job start
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@264fe205361cbb2ee8f26280998a75680ee33b53  # v1.3.0
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_REQUIRED_USER }}
          key: ${{ secrets.GERRIT_SSH_REQUIRED_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
          comment-only: true
      - name: Allow replication
        run: sleep 10s

  call-gerrit-rtdv3-merge:
    needs: notify
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/docs-workflows/.github/workflows/docs-build.yaml@e45373ca19baab097906986583db3c18f664b9b0  # v0.3.0
    with:
      mode: 'merge'
      # A merged change builds from the branch, not from a change ref.
      repository: ${{ inputs.TARGET_REPO }}
      ref: ${{ inputs.GERRIT_BRANCH }}
      gerrit_project: ${{ inputs.GERRIT_PROJECT }}
      gerrit_branch: ${{ inputs.GERRIT_BRANCH }}
      # gerrit_url falls back to the GERRIT_URL organisation variable.
      # ONAP-only egress endpoints, merged with the lfreleng-actions
      # baseline. Pinned: bump this ref when the list changes.
      # yamllint disable-line rule:line-length
      harden_runner_supplemental_allowlist: 'onap//.github/harden-runner/onap/allow_list.txt@fad6e762d5838d3ed91bb5d2fdfbbbd943819d13'
    secrets:
      RTD_TOKEN: ${{ secrets.RTD_TOKEN }}

  report-status:
    name: Report status
    if: ${{ always() }}
    needs: [notify, call-gerrit-rtdv3-merge]
    runs-on: ubuntu-latest
    # Votes travel to Gerrit over SSH, so GITHUB_TOKEN needs no scopes.
    permissions: {}
    steps:
      - name: Report workflow conclusion
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@264fe205361cbb2ee8f26280998a75680ee33b53  # v1.3.0
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_REQUIRED_USER }}
          key: ${{ secrets.GERRIT_SSH_REQUIRED_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          # Read each needed job's result directly. The workflow-conclusion
          # action read the jobs API, which can still list finished jobs
          # as running; it then fell back to 'skipped', a vote type
          # gerrit-review-action rejects.
          vote-type: >-
            ${{ contains(needs.*.result, 'failure') && 'failure'
                || contains(needs.*.result, 'cancelled') && 'cancelled'
                || 'success' }}
          comment-only: true
