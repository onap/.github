---
name: Gerrit Required Bypassable Verify

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string
      TARGET_REPO:
        # yamllint disable-line rule:line-length
        description: "The target GitHub repository needing the bypassable workflow"
        required: true
        type: string

concurrency:
  # yamllint disable-line rule:line-length
  group: required-bypassable-verify-${{ github.workflow }}-${{ github.event.inputs.GERRIT_BRANCH }}-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

# Grant nothing by default; each job below asks for what it needs.
permissions: {}

jobs:
  prepare:
    name: Clear vote
    runs-on: ubuntu-latest
    # Votes travel to Gerrit over SSH, so GITHUB_TOKEN needs no scopes.
    permissions: {}
    steps:
      - name: Clear votes
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13  # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_BYPASSABLE_USER }}
          key: ${{ secrets.GERRIT_SSH_BYPASSABLE_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
      - name: Allow replication
        run: sleep 10s

  doc-rules-validation:
    needs: prepare
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: onap/.github/.github/workflows/doc-rules-compose.yaml@639eb32b69bcc9d5cdf23a2a38261247cd92616c  # main
    with:
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_ID: ${{ inputs.GERRIT_CHANGE_ID }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      TARGET_REPO: ${{ inputs.TARGET_REPO }}
    secrets:
      # yamllint disable-line rule:line-length
      GERRIT_SSH_BYPASSABLE_PRIVKEY: ${{ secrets.GERRIT_SSH_BYPASSABLE_PRIVKEY }}

  rtd-validation:
    needs: prepare
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/docs-workflows/.github/workflows/docs-build.yaml@ac482902ade7c19fa868588336b455d13409562c  # v0.0.4
    with:
      mode: 'verify'
      # A patchset builds from the change ref rather than the branch.
      repository: ${{ inputs.TARGET_REPO }}
      gerrit_refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit_project: ${{ inputs.GERRIT_PROJECT }}
      gerrit_branch: ${{ inputs.GERRIT_BRANCH }}
      # gerrit_url falls back to the GERRIT_URL organisation variable.
    secrets:
      RTD_TOKEN: ${{ secrets.RTD_TOKEN }}

  vote:
    name: Set vote
    if: ${{ always() }}
    # yamllint enable rule:line-length
    needs: [prepare, doc-rules-validation, rtd-validation]
    runs-on: ubuntu-latest
    permissions:
      actions: read  # workflow-conclusion reads job results via the API
    steps:
      # yamllint disable-line rule:line-length
      - name: Get conclusion
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526  # v3.0.0
      - name: Set vote
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13  # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_BYPASSABLE_USER }}
          key: ${{ secrets.GERRIT_SSH_BYPASSABLE_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
